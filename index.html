    async function logGameSessionToGoogleSheet() {
      if (!gameState.sheetWebhookUrl) return;
      try {
        const payload = {
          timestamp: new Date().toLocaleString(),
          name: gameState.student.name || 'Anonymous',
          class: gameState.student.class || '-',
          school: gameState.student.school || '-',
          category: CURRICULUM[gameState.categoryKey]?.name || gameState.categoryKey,
          score: gameState.score,
          livesLeft: Math.max(0, gameState.lives)
        };
        await fetch(gameState.sheetWebhookUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.warn("Google Sheet dispatch error:", err);
      }
    }

    function renderCategoryMenu() {
      const grid = document.getElementById('category-grid');
      if (!grid) return;
      grid.innerHTML = '';

      Object.keys(CURRICULUM).forEach(key => {
        const cat = CURRICULUM[key];
        const isSelected = gameState.categoryKey === key;
        const isCompleted = gameState.completedCategories.includes(key);

        const card = document.createElement('div');
        // Compact, colorful, and vibrant cards with distinct category themes
        card.className = `p-2 rounded-xl cursor-pointer border-2 transition-all duration-150 flex flex-col justify-between ${
          isSelected 
            ? 'bg-gradient-to-br ' + cat.color + ' border-white text-slate-950 shadow-lg shadow-amber-500/30 scale-[1.03] ring-2 ring-yellow-300' 
            : 'bg-slate-950/80 border-slate-800 hover:border-slate-600 hover:bg-slate-900/90 text-white'
        }`;
        card.onclick = () => selectCategory(key);

        card.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <div class="w-6 h-6 rounded-lg ${isSelected ? 'bg-slate-950/20 text-slate-950' : 'bg-gradient-to-tr ' + cat.color + ' text-slate-950'} flex items-center justify-center text-xs shadow-sm font-black">
              <i class="fa-solid ${cat.icon}"></i>
            </div>
            ${isCompleted 
              ? `<span class="text-xs ${isSelected ? 'text-slate-950' : 'text-yellow-400'}"><i class="fa-solid fa-medal"></i></span>` 
              : `<span class="text-[9px] font-black uppercase px-1.5 py-0.2 rounded ${isSelected ? 'bg-slate-950/20 text-slate-950' : 'bg-slate-800 text-slate-400'}">${cat.tag}</span>`}
          </div>
          <div>
            <h4 class="font-arcade text-xs sm:text-[13px] leading-snug truncate ${isSelected ? 'text-slate-950' : 'text-white stroke-black-sm'}">${cat.name}</h4>
            <span class="text-[9px] font-extrabold uppercase tracking-tight block ${isSelected ? 'text-slate-900/80' : 'text-slate-400'}">100 Levels</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function selectCategory(key) {
      gameState.categoryKey = key;
      renderCategoryMenu();
    }
